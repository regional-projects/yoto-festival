<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>陽東祭イベント案内</title>
<style>
:root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin:0; background:#f4f4f4; color:#111; }
header {
  position: sticky; top:0; z-index:10;
  padding: max(10px, env(safe-area-inset-top)) 12px 10px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid #ddd;
}
h1 { margin:0 0 8px; font-size:1.05rem; text-align:center; }
nav { display:grid; grid-template-columns:1fr 1fr; gap:8px; max-width:720px; margin:auto; }
nav a {
  display:flex; align-items:center; justify-content:center;
  min-height:48px; padding:8px;
  color:#111; background:#fff; border:2px solid #111;
  border-radius:10px; text-decoration:none; font-weight:700;
}
main { width:100%; max-width:900px; margin:auto; background:#fff; }
section { scroll-margin-top:110px; }
.guide-image {
  display:block;
  width:100%;
  max-width:100%;
  height:auto;
}
footer { padding:18px 12px calc(18px + env(safe-area-inset-bottom)); text-align:center; font-size:.9rem; }
</style>
</head>
<body>
<header>
  <h1>陽東祭イベント案内</h1>
  <nav aria-label="ページ内メニュー">
    <a href="#list">出店一覧を見る</a>
    <a href="#map">会場マップを見る</a>
  </nav>
</header>
<main>
  <section id="list" aria-label="出店・団体一覧">
    <img class="guide-image" src="IMG_7471.jpeg" alt="陽東祭の出店・団体一覧">
  </section>
  <section id="map" aria-label="会場案内図">
    <img class="guide-image" src="IMG_7472.jpeg" alt="陽東祭の会場案内図">
  </section>
</main>
<footer>画像は端末の横幅に合わせて自動調整されます。</footer>
</body>
</html>
